name: child_voice_call
description: Internal MVP for child-friendly AI character voice calls.
publish_to: "none"
version: 0.0.5+5

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.0.10+1
  web_socket_channel: ^3.0.1
  record: ^7.1.1
  flutter_sound: ^9.30.0
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  file_picker: ^10.3.0
  http: ^1.5.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  image: ^4.5.4
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/characters.json
    - assets/character_options.json
    - assets/characters/
    - assets/audio/
