name: child_voice_call
description: Internal MVP for child-friendly AI character voice calls.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.0.10+1
  web_socket_channel: ^3.0.1
  record: ^5.1.2
  flutter_sound: ^9.6.0
  permission_handler: ^11.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/characters.json
    - assets/characters/

