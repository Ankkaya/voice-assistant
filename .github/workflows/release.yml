name: Release checks

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate semantic version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a tag such as v0.2.0 or v0.2.0-rc.1" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          declared_version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' mobile/pubspec.yaml)"
          if [[ "$declared_version" != "$version" ]]; then
            echo "Tag version $version does not match mobile/pubspec.yaml version $declared_version" >&2
            exit 1
          fi

  server-test:
    name: Server tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        working-directory: server
        run: python -m pip install --requirement requirements.txt

      - name: Compile and test
        working-directory: server
        run: |
          python -m compileall -q app tests
          python -m pytest -q

  mobile-test:
    name: Flutter checks
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies and test
        working-directory: mobile
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
